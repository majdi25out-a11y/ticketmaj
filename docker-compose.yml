version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ticketflow_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: ticketflow_db
      MYSQL_USER: ticketflow_user
      MYSQL_PASSWORD: your_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  app:
    build: .
    container_name: ticketflow_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ticketflow_user
      DB_PASSWORD: your_secure_password
      DB_NAME: ticketflow_db
    depends_on:
      - db

volumes:
  mysql_data:
